<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
{{style}}
</style>
</head>
<body>
<div class="page-controls">
  <button type="button" data-font-step="-1" title="Smaller text" aria-label="Smaller text">A&minus;</button>
  <button type="button" data-font-step="1" title="Bigger text" aria-label="Bigger text">A+</button>
  <button type="button" class="host-toggle" aria-pressed="true" title="Show or hide the host of every bookmark">Host</button>
  <button type="button" class="width-toggle" aria-pressed="false" title="Use the whole window width or the original width">Width</button>
</div>
<header class="page-header">
  <nav class="breadcrumb" aria-label="Folder path" hidden></nav>
  <h1 class="page-title">{{title}}</h1>
  <p class="page-summary">{{summary}}</p>
</header>
<main class="content">
{{content}}
</main>
<footer class="page-footer">Generated with Bookmark2html on {{date}}</footer>
<script>
/* Page controls. The browser remembers the choices made with them. */
(function () {
    var root = document.documentElement;

    /* ---------- remembered settings ---------- */

    function load(key) {
        try {
            return localStorage.getItem("bookmark2html." + key);
        } catch (e) {
            return null;
        }
    }

    function save(key, value) {
        try {
            localStorage.setItem("bookmark2html." + key, value);
        } catch (e) {
            /* storage unavailable: the setting just is not remembered */
        }
    }

    /* ---------- A- / A+ : root font size, everything is in rem ---------- */

    var MIN_SIZE = 8;
    var MAX_SIZE = 32;

    function currentSize() {
        return parseFloat(getComputedStyle(root).fontSize);
    }

    function applySize(size) {
        root.style.fontSize = size + "px";
    }

    function changeSize(step) {
        var size = Math.min(MAX_SIZE, Math.max(MIN_SIZE, currentSize() + step));
        applySize(size);
        save("fontSize", size);
    }

    function setUpFontSize() {
        if (parseFloat(load("fontSize")) > 0) {
            applySize(parseFloat(load("fontSize")));
        }
        document.querySelectorAll("[data-font-step]").forEach(function (button) {
            button.addEventListener("click", function () {
                changeSize(Number(button.dataset.fontStep));
            });
        });
    }

    /* ---------- on / off buttons ---------- */

    function setUpToggle(selector, key, onByDefault, apply) {
        var button = document.querySelector(selector);

        function set(on) {
            apply(on);
            button.setAttribute("aria-pressed", String(on));
            save(key, on);
        }

        var saved = load(key);
        set(saved === null ? onByDefault : saved === "true");
        button.addEventListener("click", function () {
            set(button.getAttribute("aria-pressed") !== "true");
        });
    }

    /* Host : show or hide the host of every bookmark */
    function showHosts(on) {
        root.classList.toggle("hide-hosts", !on);
    }

    /* Width : sheet as wide as the window, or back to its original width */
    function useFullWidth(on) {
        root.classList.toggle("full-width", on);
    }

    /* ---------- #anchor of a folder : that folder alone, below the path to it ---------- */

    var title = document.querySelector(".page-title");
    var summary = document.querySelector(".page-summary");
    var breadcrumb = document.querySelector(".breadcrumb");
    var wholePage = { title: title.textContent, summary: summary.innerHTML, documentTitle: document.title };

    function folderOf(hash) {
        try {
            var element = hash.length > 1 && document.getElementById(decodeURIComponent(hash.slice(1)));
            return element && element.classList.contains("folder") ? element : null;
        } catch (e) {
            return null;
        }
    }

    function nameOf(folder) {
        return folder.querySelector(".folder-name").textContent;
    }

    function ancestorsOf(folder) {
        var ancestors = [];
        for (var node = folder.parentElement.closest(".folder"); node; node = node.parentElement.closest(".folder")) {
            ancestors.unshift(node);
        }
        return ancestors;
    }

    function plural(count, word) {
        return count + " " + word + (count === 1 ? "" : "s");
    }

    function crumb(text, href) {
        var link = document.createElement("a");
        link.href = href;
        link.textContent = text;
        return link;
    }

    function showBreadcrumb(ancestors) {
        breadcrumb.replaceChildren(crumb(wholePage.title, "#"));
        ancestors.forEach(function (ancestor) {
            breadcrumb.append(crumb(nameOf(ancestor), "#" + ancestor.id));
        });
        breadcrumb.hidden = false;
    }

    function showHeader(text, summaryHtml, documentTitle) {
        title.textContent = text;
        summary.innerHTML = summaryHtml;
        document.title = documentTitle;
    }

    function clearFocus() {
        root.classList.remove("folder-focus");
        document.querySelectorAll(".on-path, .focused").forEach(function (folder) {
            folder.classList.remove("on-path", "focused");
        });
        breadcrumb.hidden = true;
    }

    function focusOn(folder) {
        var ancestors = ancestorsOf(folder);
        ancestors.concat(folder).forEach(function (node) {
            node.classList.add(node === folder ? "focused" : "on-path");
            node.querySelector("details").open = true;
        });
        root.classList.add("folder-focus");
        showBreadcrumb(ancestors);
        showHeader(nameOf(folder), summaryOf(folder), nameOf(folder) + " \u2013 " + wholePage.documentTitle);
    }

    function summaryOf(folder) {
        return plural(folder.querySelectorAll(".link").length, "bookmark")
                + " &middot; " + plural(folder.querySelectorAll(".folder").length, "folder");
    }

    function showAnchoredFolder() {
        var folder = folderOf(location.hash);
        clearFocus();
        if (folder) {
            focusOn(folder);
        } else {
            showHeader(wholePage.title, wholePage.summary, wholePage.documentTitle);
        }
    }

    function showAnchoredFolderFromTop() {
        showAnchoredFolder();
        window.scrollTo(0, 0);
    }

    setUpFontSize();
    setUpToggle(".host-toggle", "showHosts", true, showHosts);
    setUpToggle(".width-toggle", "fullWidth", false, useFullWidth);
    showAnchoredFolder();
    window.addEventListener("hashchange", showAnchoredFolderFromTop);
    /* the browser jumps to the anchor once the page is loaded, hiding the header */
    window.addEventListener("load", function () {
        if (root.classList.contains("folder-focus")) {
            window.scrollTo(0, 0);
        }
    });
})();
</script>
</body>
</html>
